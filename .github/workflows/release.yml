name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.3.0, no "v" prefix)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: cd src/frontend && bunx vite build

      - name: Stage frontend
        run: mv src/frontend/dist dist

      - name: Build server binaries
        run: |
          bun build src/server/index.ts --compile --target=bun-linux-x64 --outfile=admiral-linux-x64
          bun build src/server/index.ts --compile --target=bun-linux-arm64 --outfile=admiral-linux-arm64
          bun build src/server/index.ts --compile --target=bun-darwin-x64 --outfile=admiral-macos-x64
          bun build src/server/index.ts --compile --target=bun-darwin-arm64 --outfile=admiral-macos-arm64
          bun build src/server/index.ts --compile --target=bun-windows-x64 --outfile=admiral-windows-x64.exe

      - name: Package releases
        run: |
          tar czf admiral-linux-x64.tar.gz admiral-linux-x64 dist/
          tar czf admiral-linux-arm64.tar.gz admiral-linux-arm64 dist/
          tar czf admiral-macos-x64.tar.gz admiral-macos-x64 dist/
          tar czf admiral-macos-arm64.tar.gz admiral-macos-arm64 dist/
          zip -r admiral-windows-x64.zip admiral-windows-x64.exe dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            admiral-linux-x64.tar.gz
            admiral-linux-arm64.tar.gz
            admiral-macos-x64.tar.gz
            admiral-macos-arm64.tar.gz
            admiral-windows-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        env:
          GIT_REF: ${{ github.ref }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            echo "VERSION=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GIT_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Admiral v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/release-packages/admiral-linux-x64.tar.gz
            artifacts/release-packages/admiral-linux-arm64.tar.gz
            artifacts/release-packages/admiral-macos-x64.tar.gz
            artifacts/release-packages/admiral-macos-arm64.tar.gz
            artifacts/release-packages/admiral-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
